<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Keeps untrusted Gadget/gatekeeper UI frames confined to srcdoc (see the per-iframe
         csp attributes in GadgetUI/SandboxedGatekeeperApp/SandboxedResourceConfigurator),
         while allowing the Privy sign-in flow's own frames ('self' + auth.privy.io).
         DO NOT REMOVE. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src srcdoc: 'self' https://auth.privy.io;">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cloudflare OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
